<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBAS 歷史大數據回測系統</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* 自定義滑桿樣式 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .dark { background-color: #0f172a; color: #f8fafc; }
        .transition-all { transition: all 0.3s ease; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f8fafc] text-slate-900 transition-colors duration-300">

    <div id="app" class="min-h-screen p-4 md:p-10 max-w-[1400px] mx-auto">
        <!-- Header -->
        <header class="mb-16 flex flex-col md:flex-row justify-between items-start md:items-center gap-10">
            <div class="space-y-4">
                <div class="flex items-center gap-5">
                    <div class="p-4 rounded-[1.25rem] bg-slate-900 dark:bg-indigo-500 text-white shadow-2xl">
                        <i data-lucide="bar-chart-3" class="w-10 h-10"></i>
                    </div>
                    <div>
                        <h1 class="text-4xl font-black tracking-tight mb-1 dark:text-white">CBAS 歷史大數據回測</h1>
                        <div class="flex items-center gap-3">
                            <span class="text-sm px-3 py-1 rounded-full font-bold bg-slate-200 dark:bg-indigo-500/20 text-slate-700 dark:text-indigo-400">
                                核心：MA5 ≥ 20
                            </span>
                            <span class="text-sm px-3 py-1 rounded-full font-bold bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-400">
                                回測：排除最新 7 日
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-5 w-full md:w-auto">
                <button id="themeToggle" class="p-5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:bg-white dark:hover:bg-slate-800 transition-all shadow-sm">
                    <i data-lucide="moon" id="themeIcon" class="w-7 h-7"></i>
                </button>
                
                <label class="flex-1 md:flex-none cursor-pointer flex items-center justify-center gap-4 px-12 py-5 rounded-[1.5rem] bg-slate-900 dark:bg-indigo-600 hover:opacity-90 text-white transition-all font-black text-xl shadow-2xl active:scale-95">
                    <i data-lucide="upload" class="w-7 h-7"></i>
                    <span>匯入研究資料</span>
                    <input type="file" id="csvInput" accept=".csv" class="hidden">
                </label>
            </div>
        </header>

        <!-- Empty State -->
        <div id="emptyState" class="max-w-3xl mx-auto mt-32 text-center">
            <div class="bg-white dark:bg-slate-900 p-20 rounded-[4rem] shadow-2xl border-2 border-dashed border-slate-200 dark:border-slate-800">
                <i data-lucide="zap" class="w-20 h-20 mx-auto text-indigo-400 mb-10 opacity-20"></i>
                <h2 class="text-3xl font-black mb-6 dark:text-white">請匯入 CSV 啟動研究</h2>
                <div class="text-slate-500 dark:text-slate-400 text-xl space-y-4">
                    <p>✓ 已設定過濾 MA5 < 20 的標的</p>
                    <p>✓ 自動分組與多維度排序</p>
                </div>
            </div>
        </div>

        <!-- Main Content (Hidden by default) -->
        <main id="mainContent" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-12">
            <!-- Sidebar -->
            <aside class="lg:col-span-3 space-y-10">
                <div class="bg-white dark:bg-slate-900 p-10 rounded-[3rem] shadow-sm border border-slate-200 dark:border-slate-800">
                    <h3 class="text-sm font-black uppercase tracking-[0.3em] mb-10 opacity-50 flex items-center gap-3">
                        <i data-lucide="filter" class="w-5 h-5"></i> 條件過濾
                    </h3>
                    <div class="space-y-12">
                        <div>
                            <div class="flex justify-between mb-5">
                                <label class="text-xl font-black">爆量門檻</label>
                                <span id="thresholdVal" class="text-2xl font-mono font-black text-indigo-500">20 張</span>
                            </div>
                            <input type="range" id="thresholdSlider" min="0" max="500" step="10" value="20" class="w-full h-4 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="text-xl font-black block mb-5">標的關鍵字</label>
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                                <input type="text" id="searchInput" placeholder="名稱或代號..." class="w-full pl-16 pr-8 py-5 rounded-3xl text-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-4 focus:ring-indigo-500/20 outline-none transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-12 rounded-[3.5rem] bg-slate-900 dark:bg-indigo-600 text-white shadow-2xl">
                    <i data-lucide="activity" class="text-indigo-300 mb-10 w-10 h-10"></i>
                    <div class="space-y-10">
                        <div>
                            <p id="statWinRate" class="text-6xl font-black tracking-tighter">0%</p>
                            <p class="text-sm font-bold uppercase tracking-[0.2em] text-indigo-200/60 mt-4">歷史 T+5 上漲勝率</p>
                        </div>
                        <div class="pt-10 border-t border-white/10 grid grid-cols-2 gap-8">
                            <div>
                                <p id="statCount" class="text-3xl font-black">0</p>
                                <p class="text-xs font-bold text-indigo-200/40 uppercase mt-2">總觸發</p>
                            </div>
                            <div>
                                <p id="statAvgReturn" class="text-3xl font-black">0%</p>
                                <p class="text-xs font-bold text-indigo-200/40 uppercase mt-2">5日均績效</p>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Table Area -->
            <div id="groupContainer" class="lg:col-span-9 space-y-16">
                <!-- Grouped tables will be injected here -->
            </div>
        </main>
    </div>

    <!-- Details Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 hidden items-center justify-center p-6 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 rounded-[4rem] w-full max-w-4xl shadow-2xl border-none my-auto">
            <div class="p-14 border-b border-slate-100 dark:border-slate-800 flex justify-between items-start">
                <div>
                    <h2 id="modalTitle" class="text-5xl font-black tracking-tighter mb-4 dark:text-white">標的名稱</h2>
                    <span id="modalDate" class="text-sm font-black bg-indigo-500 text-white px-5 py-2 rounded-2xl uppercase tracking-widest">日期</span>
                </div>
                <button id="closeModal" class="p-5 rounded-full bg-slate-100 dark:bg-slate-800 hover:scale-110 transition-all">
                    <i data-lucide="x" class="w-8 h-8 text-indigo-500"></i>
                </button>
            </div>
            
            <div class="p-14">
                <div class="grid grid-cols-3 gap-10 mb-16">
                    <div class="p-10 rounded-[3rem] bg-slate-50 dark:bg-slate-800/50">
                        <p class="text-sm font-black opacity-30 uppercase tracking-[0.2em] mb-4 dark:text-white">當日拆解</p>
                        <p id="modalVal" class="text-5xl font-black text-indigo-500">0</p>
                    </div>
                    <div class="p-10 rounded-[3rem] bg-slate-50 dark:bg-slate-800/50">
                        <p class="text-sm font-black opacity-30 uppercase tracking-[0.2em] mb-4 dark:text-white">MA5 基底</p>
                        <p id="modalMA5" class="text-5xl font-black dark:text-white">0</p>
                    </div>
                    <div class="p-10 rounded-[3rem] bg-slate-50 dark:bg-slate-800/50">
                        <p class="text-sm font-black opacity-30 uppercase tracking-[0.2em] mb-4 dark:text-white">強度</p>
                        <p id="modalRatio" class="text-5xl font-black text-amber-500">0</p>
                    </div>
                </div>
                
                <div id="chartContainer" class="h-[350px] mb-16 px-6">
                    <h4 class="text-center text-sm font-black opacity-20 uppercase tracking-[0.4em] mb-10 italic dark:text-white">Performance Trend (T+N)</h4>
                    <div id="performanceChart"></div>
                </div>
                
                <button id="closeModalBtn" class="w-full py-8 rounded-[2.5rem] bg-slate-900 dark:bg-indigo-600 hover:bg-black dark:hover:bg-indigo-500 text-white font-black text-2xl transition-all shadow-2xl">
                    結束研究分析
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 核心狀態 ---
        let allAnalysisResults = [];
        let sortConfig = { key: 'cbasValue', direction: 'desc' };
        let currentChart = null;

        // --- 初始化 Lucide 圖標 ---
        lucide.createIcons();

        // --- 黑暗模式切換 ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
            // 如果 Modal 打開著，更新圖表配色
            if (currentChart) renderChart(currentChart.selectedData);
        });

        // --- 數字清理 ---
        function parseCleanNum(val) {
            if (!val) return 0;
            let s = val.toString().replace(/"/g, '').replace(/,/g, '').replace('%', '').trim();
            if (s.startsWith('(') && s.endsWith(')')) s = '-' + s.substring(1, s.length - 1);
            const num = parseFloat(s);
            return isNaN(num) ? 0 : num;
        }

        // --- CSV 解析與核心邏輯 ---
        document.getElementById('csvInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const lines = text.split(/\r?\n/).filter(l => l.trim() !== '').map(line => {
                    const matches = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=^)(?=,)|(?<=,)(?=$))/g);
                    return matches ? matches.map(m => m.trim().replace(/^"|"$/g, '')) : [];
                });

                if (lines.length < 3) return;

                const categories = lines[0];
                const subHeaders = lines[1];

                const findRange = (keyword) => {
                    const start = categories.findIndex(c => c && c.includes(keyword));
                    if (start === -1) return null;
                    let end = start + 1;
                    while (end < categories.length && (!categories[end] || categories[end] === '')) end++;
                    return { start, end: end - 1 };
                };

                const cbasRange = findRange('CBAS拆解');
                const priceRange = findRange('標的股票漲跌幅');

                if (!cbasRange || !priceRange) {
                    alert('CSV 格式不符：找不到關鍵區域');
                    return;
                }

                const availableDates = [];
                for (let j = cbasRange.start; j <= cbasRange.end; j++) {
                    const d = subHeaders[j];
                    if (d && /^\d{1,2}\/\d{1,2}$/.test(d)) {
                        const pIdx = subHeaders.indexOf(d, priceRange.start);
                        if (pIdx !== -1 && pIdx <= priceRange.end) {
                            availableDates.push({ date: d, cbasIdx: j, priceIdx: pIdx });
                        }
                    }
                }

                const timeline = availableDates.reverse(); // 舊 -> 新
                const allEvents = [];

                for (let i = 2; i < lines.length; i++) {
                    const row = lines[i];
                    const stockCode = row[1];
                    const stockName = row[2];
                    if (!stockCode || !stockName) continue;

                    const scanEndIndex = timeline.length - 8;

                    for (let t = 5; t <= scanEndIndex; t++) {
                        const triggerDay = timeline[t];
                        const currentVol = parseCleanNum(row[triggerDay.cbasIdx]);
                        
                        let sumPrev5 = 0;
                        for (let k = 1; k <= 5; k++) {
                            sumPrev5 += parseCleanNum(row[timeline[t - k].cbasIdx]);
                        }
                        const ma5 = sumPrev5 / 5;

                        // 邏輯篩選：今日爆量且 MA5 >= 20
                        if (currentVol > ma5 && ma5 >= 20) {
                            const calcReturn = (days) => {
                                let cum = 0;
                                let found = false;
                                for (let n = 1; n <= days; n++) {
                                    if (timeline[t + n]) {
                                        cum += parseCleanNum(row[timeline[t + n].priceIdx]);
                                        found = true;
                                    }
                                }
                                return found ? parseFloat(cum.toFixed(2)) : null;
                            };

                            allEvents.push({
                                id: `${stockCode}-${triggerDay.date}-${t}`,
                                code: stockCode,
                                name: stockName,
                                triggerDate: triggerDay.date,
                                cbasValue: currentVol,
                                ma5: ma5.toFixed(1),
                                ratioNum: ma5 === 0 ? 999 : (currentVol / ma5),
                                ratio: ma5 === 0 ? '初次爆量' : (currentVol / ma5).toFixed(1) + 'x',
                                r1: calcReturn(1),
                                r3: calcReturn(3),
                                r5: calcReturn(5),
                                r7: calcReturn(7)
                            });
                        }
                    }
                }

                allAnalysisResults = allEvents;
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                renderUI();
            };
            reader.readAsText(file);
        });

        // --- UI 渲染邏輯 ---
        function renderUI() {
            const threshold = parseInt(document.getElementById('thresholdSlider').value);
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allAnalysisResults.filter(item => 
                item.cbasValue >= threshold && 
                (item.code.includes(searchTerm) || item.name.includes(searchTerm))
            );

            // 更新統計
            const valid = filtered.filter(i => i.r5 !== null);
            if (valid.length > 0) {
                const wins = valid.filter(i => i.r5 > 0).length;
                const avg = valid.reduce((acc, curr) => acc + curr.r5, 0) / valid.length;
                document.getElementById('statWinRate').textContent = ((wins / valid.length) * 100).toFixed(1) + '%';
                document.getElementById('statCount').textContent = valid.length;
                document.getElementById('statAvgReturn').textContent = avg.toFixed(2) + '%';
                const colorClass = avg >= 0 ? 'text-red-400' : 'text-green-400';
                document.getElementById('statAvgReturn').className = `text-3xl font-black ${colorClass}`;
            }

            // 分組並排序
            const groupsMap = {};
            filtered.forEach(e => {
                if (!groupsMap[e.triggerDate]) groupsMap[e.triggerDate] = [];
                groupsMap[e.triggerDate].push(e);
            });

            const sortedDates = Object.keys(groupsMap).sort((a, b) => b.localeCompare(a));
            const groupContainer = document.getElementById('groupContainer');
            groupContainer.innerHTML = '';

            if (sortedDates.length === 0) {
                groupContainer.innerHTML = '<div class="p-32 text-center rounded-[4rem] border-2 border-dashed dark:border-slate-800 opacity-30 italic text-2xl">未發現符合條件之數據</div>';
                return;
            }

            sortedDates.forEach(date => {
                const events = groupsMap[date].sort((a, b) => {
                    const aVal = a[sortConfig.key];
                    const bVal = b[sortConfig.key];
                    const modifier = sortConfig.direction === 'desc' ? -1 : 1;
                    return aVal > bVal ? modifier * 1 : (aVal < bVal ? modifier * -1 : 0);
                });

                const groupDiv = document.createElement('div');
                groupDiv.className = 'space-y-6';
                
                let tableHtml = `
                    <div class="flex items-center gap-5 px-6">
                        <i data-lucide="calendar" class="text-indigo-500 w-7 h-7"></i>
                        <h2 class="text-3xl font-black tracking-tighter">${date}</h2>
                        <div class="h-px flex-1 ml-6 bg-slate-200 dark:bg-slate-800"></div>
                        <span class="text-sm font-black opacity-30 uppercase tracking-[0.3em]">${events.length} 筆爆量</span>
                    </div>
                    <div class="bg-white dark:bg-slate-900 rounded-[3rem] shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-100 dark:bg-slate-800 text-[13px] font-black uppercase tracking-[0.2em] text-slate-500 dark:text-slate-300">
                                <tr>
                                    <th class="px-10 py-7 cursor-pointer hover:bg-indigo-500/10" onclick="handleSort('name')">標的 / 代號 ${getSortIndicator('name')}</th>
                                    <th class="px-10 py-7 cursor-pointer hover:bg-indigo-500/10" onclick="handleSort('cbasValue')">當日 / 5日均 ${getSortIndicator('cbasValue')}</th>
                                    <th class="px-10 py-7 cursor-pointer hover:bg-indigo-500/10" onclick="handleSort('ratioNum')">強度 ${getSortIndicator('ratioNum')}</th>
                                    <th class="px-10 py-7 text-center bg-indigo-500/5 text-indigo-500 cursor-pointer" onclick="handleSort('r5')">T+5 報酬 ${getSortIndicator('r5')}</th>
                                    <th class="px-10 py-7 text-center cursor-pointer" onclick="handleSort('r7')">T+7 報酬 ${getSortIndicator('r7')}</th>
                                    <th class="px-10 py-7 text-right">詳情</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                `;

                events.forEach(item => {
                    const r5Color = item.r5 >= 0 ? 'text-red-500' : 'text-green-500';
                    const r7Color = item.r7 >= 0 ? 'text-red-500' : 'text-green-500';
                    tableHtml += `
                        <tr class="hover:bg-indigo-50/30 dark:hover:bg-indigo-500/10 transition-all cursor-pointer group" onclick='openModal(${JSON.stringify(item)})'>
                            <td class="px-10 py-9">
                                <div class="text-2xl font-black dark:text-white group-hover:text-indigo-500">${item.name}</div>
                                <div class="text-sm opacity-40 font-mono font-bold dark:text-slate-400">${item.code}</div>
                            </td>
                            <td class="px-10 py-9">
                                <div class="flex items-baseline gap-3">
                                    <span class="text-3xl font-black dark:text-white">${item.cbasValue}</span>
                                    <span class="text-sm opacity-30 font-bold tracking-widest dark:text-slate-500">/ ${item.ma5}</span>
                                </div>
                            </td>
                            <td class="px-10 py-9">
                                <span class="px-5 py-1.5 rounded-full text-xs font-black shadow-sm ${item.ratio === '初次爆量' ? 'bg-indigo-500 text-white' : 'bg-amber-500/10 text-amber-600'}">
                                    ${item.ratio}
                                </span>
                            </td>
                            <td class="px-10 py-9 text-center font-black text-2xl bg-indigo-500/5 ${r5Color}">
                                ${item.r5 !== null ? (item.r5 > 0 ? '+' + item.r5 : item.r5) : '--'}%
                            </td>
                            <td class="px-10 py-9 text-center font-black text-xl ${r7Color}">
                                ${item.r7 !== null ? (item.r7 > 0 ? '+' + item.r7 : item.r7) : '--'}%
                            </td>
                            <td class="px-10 py-9 text-right">
                                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 opacity-0 group-hover:opacity-100 transition-all scale-75 group-hover:scale-100">
                                    <i data-lucide="chevron-right" class="w-7 h-7"></i>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                tableHtml += `</tbody></table></div>`;
                groupDiv.innerHTML = tableHtml;
                groupContainer.appendChild(groupDiv);
            });
            lucide.createIcons();
        }

        function getSortIndicator(key) {
            if (sortConfig.key !== key) return `<i data-lucide="arrow-up-down" class="inline w-4 h-4 opacity-20 ml-1"></i>`;
            return sortConfig.direction === 'desc' ? 
                `<i data-lucide="chevron-down" class="inline w-4 h-4 text-indigo-500 ml-1"></i>` : 
                `<i data-lucide="chevron-up" class="inline w-4 h-4 text-indigo-500 ml-1"></i>`;
        }

        function handleSort(key) {
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'desc' ? 'asc' : 'desc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'desc';
            }
            renderUI();
        }

        // --- 控制器監聽 ---
        document.getElementById('thresholdSlider').addEventListener('input', (e) => {
            document.getElementById('thresholdVal').textContent = e.target.value + ' 張';
            renderUI();
        });
        document.getElementById('searchInput').addEventListener('input', renderUI);

        // --- Modal & Chart ---
        function openModal(item) {
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalDate').textContent = '觸發日期：' + item.triggerDate;
            document.getElementById('modalVal').textContent = item.cbasValue;
            document.getElementById('modalMA5').textContent = item.ma5;
            document.getElementById('modalRatio').textContent = item.ratio;

            renderChart(item);
        }

        function renderChart(item) {
            const chartEl = document.getElementById('performanceChart');
            chartEl.innerHTML = '';
            
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';

            const options = {
                series: [{
                    name: '累積報酬率',
                    data: [item.r1, item.r3, item.r5, item.r7].filter(v => v !== null)
                }],
                chart: {
                    type: 'line',
                    height: 350,
                    toolbar: { show: false },
                    zoom: { enabled: false },
                    animations: { enabled: true }
                },
                stroke: { curve: 'smooth', width: 8, colors: ['#6366f1'] },
                markers: { size: 10, colors: ['#6366f1'], strokeWidth: 4, strokeColors: isDark ? '#1e293b' : '#fff' },
                xaxis: {
                    categories: ['T+1', 'T+3', 'T+5', 'T+7'].slice(0, [item.r1, item.r3, item.r5, item.r7].filter(v => v !== null).length),
                    labels: { style: { colors: textColor, fontWeight: 900, fontSize: '14px' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    labels: { 
                        formatter: (v) => v + '%',
                        style: { colors: textColor, fontWeight: 900, fontSize: '14px' }
                    }
                },
                grid: { borderColor: isDark ? '#334155' : '#e2e8f0', strokeDashArray: 5, yaxis: { lines: { show: true } }, xaxis: { lines: { show: false } } },
                tooltip: { 
                    theme: isDark ? 'dark' : 'light',
                    y: { formatter: (v) => v + '%' }
                }
            };

            const chart = new ApexCharts(chartEl, options);
            chart.render();
            currentChart = { instance: chart, selectedData: item };
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (currentChart && currentChart.instance) {
                currentChart.instance.destroy();
                currentChart = null;
            }
        }

        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

    </script>
</body>
</html>
